location = /owlyfuk { return 301 /owlyfuk/; }

location = /owlyfuk/ {
    include snippets/lab-headers.conf;
    add_header Cache-Control "no-cache" always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self'; script-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;
    try_files /owlyfuk/index.html =404;
}

location ^~ /owlyfuk/ {
    include snippets/lab-headers.conf;
    add_header Cache-Control "public, max-age=3600" always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self'; script-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;
    try_files $uri =404;
}
