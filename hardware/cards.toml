# The Wi-Fi cards README.md's "Supported hardware" table lists, one
# [[card]] each. `cargo xtask hardware` builds the table from this file,
# the `owly test-card` reports in hardware/reports/, and
# crates/owly-radio/drivers.toml; see xtask/src/hardware.rs for the rules.
# Edit these, then run it: the table itself is generated.
#
#   name              the card as people know it, such as "Intel AX211"
#   driver            its kernel driver, as in drivers.toml and the reports
#   ids               its PCI or USB IDs (`lspci -nn`, `lsusb`), such as
#                     "8086:51f1". A report is matched to its card by the
#                     device ID it names, so every reported ID has to be
#                     listed here. A card known only by name has none until
#                     its first report
#   status            its status cell, until a report gives it a new one
#   tested_on         the machines that status came from, as its
#                     "Tested on" cell lists them, before the reports'
#                     machines
#
# The generator groups and sorts the cards; within a group they keep this
# file's order.

